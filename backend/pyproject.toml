[project]
name = "stemforge"
version = "1.0.0"
description = "Stemforge: AI music deconstruction studio backend (separation, transcription, MIDI)"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
# torch/torchaudio are installed separately (CUDA vs CPU wheels come from different indexes),
# and demucs/basic-pitch are installed with --no-deps (see requirements/README and scripts/setup).
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "soundfile>=0.12",
  "soxr>=0.3",
  "numpy>=1.26",
  "scipy>=1.11",
  "librosa>=0.10.2",
  "resampy>=0.2.2,<0.4.3",
  "mir_eval>=0.7",
  "pretty_midi>=0.2.10",
  "scikit-learn>=1.3",
  "onnxruntime>=1.18",
  "mido>=1.3",
  "symusic>=0.5",
  "julius>=0.2.7",
  "einops>=0.8",
  "lameenc>=1.7",
  "openunmix>=1.3",
  "dora-search>=0.1.12",
  "pyyaml>=6",
  "tqdm>=4.66",
  "safetensors>=0.4",
  "pillow>=10",
  "httpx>=0.27",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
av = ["av>=12"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
stemforge-api = "stemforge.cli:api"
stemforge-worker = "stemforge.cli:worker"
stemforge-models = "stemforge.cli:models"
stemforge-cleanup = "stemforge.cli:cleanup"
stemforge-migrate = "stemforge.cli:migrate"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stemforge*"]

[tool.setuptools.package-data]
stemforge = ["migrations/*.py", "migrations/versions/*.py", "migrations/script.py.mako", "model_manifest.json"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "models: tests that need downloaded model weights (skipped when missing)",
  "slow: long-running end-to-end tests",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
