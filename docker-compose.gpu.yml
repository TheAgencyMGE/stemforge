# GPU override: builds the CUDA 12.8 PyTorch wheel and reserves an NVIDIA GPU for the worker.
# Requires the NVIDIA Container Toolkit on the host.
services:
  models:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu128
  api:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu128
  worker:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu128
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
